name: Validate Messaging App
on:
  push:
    paths:
      - 'messaging_app.py'
      - 'school_chat.py'
      - 'owner_guardian.py'
      - 'guardian_launcher.py'
      - 'tests/**'
      - '.github/workflows/check-python.yml'
  pull_request:
    paths:
      - 'messaging_app.py'
      - 'school_chat.py'
      - 'owner_guardian.py'
      - 'guardian_launcher.py'
      - 'tests/**'
jobs:
  messaging-app-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install guardian signature verification dependency
        run: python -m pip install 'cryptography>=43,<49'
      - name: Check Messaging App, compatibility launcher and guardian syntax
        run: python -m py_compile messaging_app.py school_chat.py owner_guardian.py guardian_launcher.py
      - name: Run messaging, security and browser regression tests
        run: python -m unittest discover -s tests -v
