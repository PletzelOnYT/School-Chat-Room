name: Validate Messaging App
on:
  push:
    paths:
      - 'app/**'
      - 'guardian/**'
      - 'docs/**'
      - 'launcher.py'
      - 'README.md'
      - 'tests/**'
      - '.github/workflows/check-python.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'guardian/**'
      - 'docs/**'
      - 'launcher.py'
      - 'README.md'
      - 'tests/**'
jobs:
  messaging-app-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install guardian signature verification dependency
        run: python -m pip install 'cryptography>=43,<49'
      - name: Check Chat Room launcher and production Python syntax
        run: python -m py_compile launcher.py app/messaging_app.py guardian/owner_guardian.py guardian/guardian_launcher.py
      - name: Run messaging, security and browser regression tests
        run: python -m unittest discover -s tests -v
